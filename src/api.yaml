openapi: 3.0.0
info:
  title: Databack Administration API
  description: API for administration of databacker backup engines and protected databases
  version: "1.0.0"

servers:
  - url: /
    description: administration of databacker cloud

security:
  - JWT: []

# Common parameters and responses
x-parameters:
  limit: &limit-param
    in: query
    name: limit
    schema:
      type: integer
    required: false
    description: Maximum number of results to return
  offset: &offset-param
    in: query
    name: offset
    schema:
      type: integer
    required: false
    description: Number of results to skip
  account: &account-param
    in: path
    name: account
    schema:
      type: string
    required: true
    description: Account ID
  engine: &engine-param
    in: path
    name: engine
    schema:
      type: string
    required: true
    description: Unique ID of the backup engine
  database: &database-param
    in: path
    name: database
    schema:
      type: string
    required: true
    description: Unique ID of the database target
  config: &config-param
    in: path
    name: config
    schema:
      type: string
    required: true
    description: Unique ID of the config
  log: &log-param
    in: path
    name: log
    schema:
      type: string
    required: true
    description: Unique ID of the log
  user: &user-param
    in: path
    name: user
    schema:
      type: string
    required: true
    description: Unique ID of the user
  backup: &backup-param
    in: path
    name: backup
    schema:
      type: string
    required: true
    description: Unique ID of the backup run

x-responses:
  not-found: &not-found-response
    '404':
      description: not found
  error-message: &error-message-schema
    type: object
    properties:
      message:
        type: string
  invalid-request: &invalid-request-response
    '400':
      description: Invalid request
      content:
        application/json:
          schema:
            *error-message-schema
  quota-exceeded: &quota-exceeded-response
    '422':
      description: Quota exceeded
      content:
        application/json:
          schema:
            *error-message-schema

paths:      
  /auth/login:
    get:
      summary: Start browser OAuth login
      operationId: GetAuthLogin
      description: Starts browser OAuth login. Sets a transient OAuth state cookie and redirects to the configured identity provider authorization URL.
      security: []
      parameters:
        - name: redirect
          in: query
          required: false
          description: Post-login frontend redirect target.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the identity provider authorization URL.
          headers:
            Location:
              description: Configured identity provider authorization URL.
              schema:
                type: string
        '500':
          description: Authentication flow unavailable.

  /auth/callback:
    get:
      summary: Complete browser OAuth login
      operationId: GetAuthCallback
      description: Receives the OAuth authorization-code callback. Validates the transient OAuth state cookie and query parameter, exchanges the code for an identity provider token, fetches the user identity, sets the application session cookie, and redirects to the configured frontend destination.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code returned by the identity provider; omitted on some error callbacks.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: OAuth state returned by the identity provider; malformed or missing values are validated by the server.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Authorization error returned by the identity provider.
          schema:
            type: string
      responses:
        '302':
          description: Successful login redirect to the configured frontend destination.
          headers:
            Location:
              description: Configured post-login frontend destination.
              schema:
                type: string
        '400':
          description: Missing or invalid OAuth state or authorization code.
        '401':
          description: Authentication failed or the identity provider returned an authorization error.
        '500':
          description: Authentication flow unavailable.

  /auth/logout:
    get:
      summary: Terminate browser session
      operationId: GetAuthLogout
      description: Terminates the application browser session by validating an optional post-logout redirect target against the permitted frontend-origin allowlist, defaulting to the configured post-logout frontend destination when none is provided, and clearing the application session cookie and transient OAuth state cookie. If an identity provider logout endpoint is configured, the validated target is passed as its post_logout_redirect_uri; otherwise the response redirects directly to the validated target.
      security: []
      parameters:
        - name: redirect
          in: query
          required: false
          description: Post-logout frontend redirect target; must match a permitted frontend origin.
          schema:
            type: string
      responses:
        '302':
          description: Logout redirect.
          headers:
            Location:
              description: Configured identity provider logout endpoint or post-logout frontend destination.
              schema:
                type: string
        '400':
          description: Invalid post-logout redirect target.

  /admin/system/healthz:
    get:
      description: health check endpoint, accessible without authentication
      security: []
      responses:
        '200':
          description: system is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /admin/register:
    post:
      description: register a new user; does not require a pre-existing user record, only a valid JWT from the identity provider
      requestBody:
        description: information for the new user
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/UserWithEmail'
      responses:
        '201':
          description: successfully registered user
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ID'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/self:
    get:
      description: retrieve the profile of the calling user, scoped to the JWT subject
      responses:
        <<: *not-found-response
        '200':
          description: profile of the calling user
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/User'
    patch:
      description: update the profile of the calling user, scoped to the JWT subject
      requestBody:
        description: profile fields to update
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/UserBody'
      responses:
        <<: *not-found-response
        '200':
          description: profile successfully updated
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/User'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/self/email:
    patch:
      summary: Change user email address
      description: Request to change the email address. Triggers verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/Email'
      responses:
        '204':
          description: Email change requested, verification sent.
        '400':
          description: Invalid email or already in use.
        '401':
          description: Authentication required.

  /admin/self/email/verify:
    get:
      summary: Verify a pending email address
      operationId: GetAdminSelfEmailVerify
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email updated
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/User'
        '400':
          description: Invalid or expired token
        '401':
          description: Unauthorized

  /admin/self/accounts:
    get:
      description: list the accounts the calling user belongs to, along with their role in each
      parameters:
      - *offset-param
      - *limit-param
      responses:
        '200':
          description: list of accounts with roles
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/PaginatedSelfAccounts'
    post:
      description: create a new account; the calling user is automatically made the owner
      requestBody:
        description: information for the new account
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/AccountBody'
      responses:
        '201':
          description: successfully created account
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ID'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema
        '422':
          description: Quota exceeded
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/system/stats:
    get:
      description: global system statistics (admin only)
      responses:
        '200':
          description: system statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_accounts:
                    type: integer
                  total_engines:
                    type: integer
                  total_databases:
                    type: integer
                  total_users:
                    type: integer
                  storage_used_bytes:
                    type: integer

  /admin/accounts:      
    get:
      description: list all of the accounts for which the authenticated user has access
      parameters:
      - *offset-param
      - *limit-param
      responses:
        '404':
          description: no accounts available
        '200':
          description: list of accounts for my user
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/PaginatedAccounts'
    post:
      description: create a new account, normally limited to system administrators
      requestBody:
        description: information for new account
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/Account'
      responses:
        '201':
          description: successfully created account
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ID'  # returns the body created
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object 
                properties:           
                  message:
                    type: string
        '422':
          description: Quota exceeded
          content:
            application/json:
              schema:
                type: object 
                properties:           
                  message:
                    type: string
  /admin/accounts/{account}:      
    get:
      description: get information about the specific account
      parameters:
        - *account-param
      responses:
        <<: *not-found-response
        '200':
          description: details of the account
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Account'
    patch:
      description: update account details (admin only)
      parameters:
        - *account-param
      requestBody:
        description: account updates
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/Account'
      responses:
        <<: *not-found-response
        '200':
          description: account successfully updated
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Account'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema
    delete:
      description: delete an account (admin only)
      parameters:
        - *account-param
      responses:
        '204':
          description: account successfully deleted
        <<: *not-found-response
  /admin/accounts/{account}/engines:
    get:
      description: list backup engines in a given account with row summary fields
      parameters:
        - *account-param
        - *offset-param
        - *limit-param
      responses:
        <<: *not-found-response
        '200':
          description: backup engines for the given account
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/PaginatedEngines'
    post:
      description: register a new backup engine in the given account
      parameters:
        - *account-param
      requestBody:
        description: backup engine registration details
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/EngineBody'
      responses:
        '201':
          description: successfully registered backup engine
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Engine'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema
        '422':
          description: Quota exceeded
          content:
            application/json:
              schema:
                *error-message-schema
  /admin/accounts/{account}/engines/{engine}:
    get:
      description: get information about a specific backup engine
      parameters:
        - *account-param
        - *engine-param
      responses:
        <<: *not-found-response
        '200':
          description: details of the backup engine
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Engine'
    patch:
      description: update a specific backup engine
      parameters:
        - *account-param
        - *engine-param
      requestBody:
        description: backup engine updates
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/EngineBody'
      responses:
        <<: *not-found-response
        '200':
          description: backup engine successfully updated
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Engine'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema
    delete:
      description: delete a specific backup engine
      parameters:
        - *account-param
        - *engine-param
      responses:
        '204':
          description: backup engine successfully deleted
        <<: *not-found-response

  /admin/accounts/{account}/databases:
    get:
      description: list protected databases in a given account with row summary fields
      parameters:
        - *account-param
        - name: engine
          in: query
          schema:
            type: string
          description: filter to databases protected by a specific backup engine ID
        - name: system
          in: query
          schema:
            type: string
          description: filter to a specific database engine type
        - name: transport
          in: query
          schema:
            type: string
          description: filter to a specific network transport
        - name: address
          in: query
          schema:
            type: string
          description: filter to a specific hostname, IP, or socket path
        - *offset-param
        - *limit-param
      responses:
        <<: *not-found-response
        '200':
          description: protected databases for the given account
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/PaginatedDatabases'
    post:
      description: create a protected database record associated with a backup engine
      parameters:
        - *account-param
      requestBody:
        description: protected database details
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/DatabaseBody'
      responses:
        '201':
          description: successfully created protected database
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Database'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/accounts/{account}/databases/{database}:
    get:
      description: get information about a specific protected database
      parameters:
        - *account-param
        - *database-param
      responses:
        <<: *not-found-response
        '200':
          description: details of the protected database
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Database'
    patch:
      description: update a protected database record
      parameters:
        - *account-param
        - *database-param
      requestBody:
        description: protected database updates
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/DatabaseBody'
      responses:
        <<: *not-found-response
        '200':
          description: protected database successfully updated
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Database'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema
    delete:
      description: delete a protected database record
      parameters:
        - *account-param
        - *database-param
      responses:
        '204':
          description: protected database successfully deleted
        <<: *not-found-response

  /admin/accounts/{account}/databases/{database}/backups:
    get:
      operationId: ListDatabaseBackups
      description: get paginated backup run summaries for a specific protected database; timeline events are not embedded in this list response
      parameters:
        - *account-param
        - *database-param
        - name: status
          in: query
          schema:
            type: string
          description: backup status to filter by
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
        - name: latest_per_database
          in: query
          schema:
            type: boolean
          description: when true, return only the latest backup event for this database
        - *offset-param
        - *limit-param
      responses:
        <<: *not-found-response
        '200':
          description: backup summaries for the specified protected database
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/PaginatedBackupEvents'

  /admin/accounts/{account}/databases/{database}/logs:
    get:
      description: get backup log summaries for a specific protected database
      parameters:
        - *account-param
        - *database-param
        - *offset-param
        - *limit-param
      responses:
        <<: *not-found-response
        '200':
          description: backup logs for the specified protected database
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/PaginatedLogSummaries'

  /admin/accounts/{account}/backups:
    get:
      operationId: ListAccountBackups
      description: get paginated backup run summaries across all protected databases in an account; timeline events are not embedded in this list response
      parameters:
        - *account-param
        - name: engine
          in: query
          schema:
            type: string
          required: false
          description: filter to backups produced by a specific backup engine ID
        - name: database
          in: query
          schema:
            type: string
          required: false
          description: filter to backups for a specific protected database ID
        - name: status
          in: query
          schema:
            type: string
          description: backup status to filter by
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
        - name: latest_per_database
          in: query
          schema:
            type: boolean
          description: when true, return only the latest backup event per protected database
        - *offset-param
        - *limit-param
      responses:
        <<: *not-found-response
        '200':
          description: backup summaries for the account
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/PaginatedBackupEvents'

  /admin/accounts/{account}/backups/{backup}:
    get:
      operationId: GetBackup
      description: get a specific backup run. By default this returns metadata without embedded product timeline events; pass include=events to include the chronological product-level event timeline.
      parameters:
        - *account-param
        - *backup-param
        - name: include
          in: query
          required: false
          schema:
            type: string
            enum: [events]
          description: include=events embeds product-level backup timeline events in the response
      responses:
        <<: *not-found-response
        '200':
          description: backup run details
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/BackupEvent'

  /admin/accounts/{account}/backups/{backup}/events:
    get:
      operationId: GetBackupEvents
      description: get chronological product-level events for exactly one backup run. Events are derived from OTEL traces/spans when available, but the response is product-shaped rather than raw OTEL.
      parameters:
        - *account-param
        - *backup-param
      responses:
        <<: *not-found-response
        '200':
          description: product-level backup timeline events
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/BackupTimelineEvents'

  /admin/accounts/{account}/backups/{backup}/trace:
    get:
      operationId: GetBackupTrace
      description: get raw trace diagnostic data for exactly one backup run. Product UIs should use backup timeline events for normal status timelines.
      parameters:
        - *account-param
        - *backup-param
      responses:
        <<: *not-found-response
        '200':
          description: raw trace diagnostics for a backup run
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/BackupTraceDiagnostics'

  /admin/accounts/{account}/logs/{log}:
    get:
      description: get the backup logs for a specific backup run
      parameters:
        - *account-param
        - *log-param
        - *offset-param
        - *limit-param
      responses:
        <<: *not-found-response
        '200':
          description: backup logs for a specific backup run, streamed
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/PaginatedLogs'
  /admin/accounts/{account}/engines/{engine}/configs:
    get:
      description: list cloud-managed configs for a specific backup engine
      parameters:
        - *account-param
        - *engine-param
        - *offset-param
        - *limit-param
      responses:
        <<: *not-found-response
        '200':
          description: configs for the given backup engine
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './schemas.yaml#/components/schemas/PaginationMetadata'
                  - type: object
                    properties:
                      configs:
                        type: array
                        items:
                          $ref: '../external/databacker-api/src/schemas.yaml#/components/schemas/Config'
    post:
      description: create a new cloud-managed config for a backup engine
      parameters:
        - *account-param
        - *engine-param
      requestBody:
        description: config for the backup engine
        content:
          application/json:
            schema:
              $ref: '../external/databacker-api/src/schemas.yaml#/components/schemas/Config'
      responses:
        '201':
          description: successfully created config
          content:
            application/json:
              schema:
                $ref: '../external/databacker-api/src/schemas.yaml#/components/schemas/Config'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/accounts/{account}/configs/{config}:
    get:
      description: retrieve a specific device config
      parameters:
        - *account-param
        - *config-param
      responses:
        <<: *not-found-response
        '200':
          description: details of the config
          content:
            application/json:
              schema:
                $ref: '../external/databacker-api/src/schemas.yaml#/components/schemas/Config'
    delete:
      description: delete a specific device config
      parameters:
        - *account-param
        - *config-param
      responses:
        '204':
          description: config successfully deleted
        <<: *not-found-response

  /admin/users:
    get:
      description: list all users in the system (admin only)
      parameters:
        - *offset-param
        - *limit-param
        - in: query
          name: search
          schema:
            type: string
          required: false
          description: Search term to filter users by name or email
      responses:
        '200':
          description: list of all users
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/PaginatedUsers'
    post:
      description: create a new user (admin only)
      requestBody:
        description: information for new user
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/UserWithEmail'
      responses:
        '201':
          description: successfully created user
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/User'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/users/{user}:
    delete:
      description: delete a user (admin only)
      parameters:
        - *user-param
      responses:
        '204':
          description: user successfully deleted
        <<: *not-found-response

  /admin/accounts/{account}/users:
    get:
      description: list users in an account
      parameters:
        - *account-param
        - *offset-param
        - *limit-param
      responses:
        <<: *not-found-response
        '200':
          description: list of users in the account
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/PaginatedAccountMembers'
    post:
      description: add a user to an account
      parameters:
        - *account-param
      requestBody:
        description: user to add to account
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                  description: User ID to add to account
                role:
                  type: string
                  description: Role to assign to the user in the account
              required:
                - user
                - role
      responses:
        '201':
          description: user successfully added to account
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema
        <<: *not-found-response

  /admin/accounts/{account}/users/{user}:
    delete:
      description: remove a user from an account
      parameters:
