openapi: 3.0.0
info:
  title: Databack Administration API
  description: API for administration of databacker instances
  version: "1.0.0"

servers:
  - url: /
    description: administration of databacker cloud

security:
  - JWT: []

# Common parameters and responses
x-parameters:
  account: &account-param
    in: path
    name: account
    schema:
      type: string
    required: true
    description: Account ID
  instance: &instance-param
    in: path
    name: instance
    schema:
      type: string
    required: true
    description: Unique ID of the databacker instance
  trace: &trace-param
    in: path
    name: trace
    schema:
      type: string
    required: true
    description: Unique ID of the trace
  span: &span-param
    in: path
    name: span
    schema:
      type: string
    required: true
    description: Unique ID of the span
  config: &config-param
    in: path
    name: config
    schema:
      type: string
    required: true
    description: Unique ID of the config
  log: &log-param
    in: path
    name: log
    schema:
      type: string
    required: true
    description: Unique ID of the log
  user: &user-param
    in: path
    name: user
    schema:
      type: string
    required: true
    description: Unique ID of the user

x-responses:
  not-found: &not-found-response
    '404':
      description: not found
  error-message: &error-message-schema
    type: object
    properties:
      message:
        type: string
  invalid-request: &invalid-request-response
    '400':
      description: Invalid request
      content:
        application/json:
          schema:
            *error-message-schema
  quota-exceeded: &quota-exceeded-response
    '422':
      description: Quota exceeded
      content:
        application/json:
          schema:
            *error-message-schema

paths:      
  /admin/system/healthz:
    get:
      description: health check endpoint, accessible without authentication
      security: []
      responses:
        '200':
          description: system is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /admin/register:
    post:
      description: register a new user; does not require a pre-existing user record, only a valid JWT from the identity provider
      requestBody:
        description: information for the new user
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/UserBody'
      responses:
        '201':
          description: successfully registered user
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ID'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/self:
    get:
      description: retrieve the profile of the calling user, scoped to the JWT subject
      responses:
        <<: *not-found-response
        '200':
          description: profile of the calling user
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/User'
    patch:
      description: update the profile of the calling user, scoped to the JWT subject
      requestBody:
        description: profile fields to update
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/UserBody'
      responses:
        <<: *not-found-response
        '200':
          description: profile successfully updated
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/User'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/self/accounts:
    get:
      description: list the accounts the calling user belongs to, along with their role in each
      responses:
        '200':
          description: list of accounts with roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/SelfAccountEntry'
    post:
      description: create a new account; the calling user is automatically made the owner
      requestBody:
        description: information for the new account
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/SelfCreateAccountRequest'
      responses:
        '201':
          description: successfully created account
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ID'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema
        '422':
          description: Quota exceeded
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/system/stats:
    get:
      description: global system statistics (admin only)
      responses:
        '200':
          description: system statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_accounts:
                    type: integer
                  total_instances:
                    type: integer
                  total_users:
                    type: integer
                  storage_used_bytes:
                    type: integer

  /admin/accounts:      
    get:
      description: list all of the accounts for which the authenticated user has access
      responses:
        '404':
          description: no accounts available
        '200':
          description: list of accounts for my user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/Account'
    post:
      description: create a new account, normally limited to system administrators
      requestBody:
        description: information for new account
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/Account'
      responses:
        '201':
          description: successfully created account
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ID'  # returns the body created
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object 
                properties:           
                  message:
                    type: string
        '422':
          description: Quota exceeded
          content:
            application/json:
              schema:
                type: object 
                properties:           
                  message:
                    type: string
  /admin/accounts/{account}:      
    get:
      description: get information about the specific account
      parameters:
        - *account-param
      responses:
        <<: *not-found-response
        '200':
          description: details of the account
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Account'
    patch:
      description: update account details (admin only)
      parameters:
        - *account-param
      requestBody:
        description: account updates
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/Account'
      responses:
        <<: *not-found-response
        '200':
          description: account successfully updated
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Account'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema
    delete:
      description: delete an account (admin only)
      parameters:
        - *account-param
      responses:
        '204':
          description: account successfully deleted
        <<: *not-found-response
  /admin/accounts/{account}/instances:
    get:
      description: list all of the instances in a given account
      parameters:
        - *account-param
      responses:
        <<: *not-found-response
        '200':
          description: list of instances for the given account
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string # just list of IDs
    post:
      description: create a new licensed databacker instance in the given account
      parameters:
        - *account-param
      requestBody:
        description: information for new licensed databacker instance
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/InstanceBody'
      responses:
        '201':
          description: successfully created instance
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/InstanceBody'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema
        '422':
          description: Quota exceeded
          content:
            application/json:
              schema:
                *error-message-schema
  /admin/accounts/{account}/instances/{instance}:
    get:
      description: get information about a specific instance
      parameters:
        - *account-param
        - *instance-param
      responses:
        <<: *not-found-response
        '200':
          description: details of the instance
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/InstanceBody'
    patch:
      description: update configuration of a specific instance
      parameters:
        - *account-param
        - *instance-param
      requestBody:
        description: instance configuration updates
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/InstanceBody'
      responses:
        <<: *not-found-response
        '200':
          description: instance successfully updated
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/InstanceBody'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema
    delete:
      description: delete a specific instance
      parameters:
        - *account-param
        - *instance-param
      responses:
        '204':
          description: instance successfully deleted
        <<: *not-found-response

  /admin/accounts/{account}/instances/{instance}/logs:
    get:
      description: get list of backup logs for a specific instance
      parameters:
        - *account-param
        - *instance-param
      responses:
        <<: *not-found-response
        '200':
          description: list of backup logs for a specific instance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/LogSummary'

  /admin/accounts/{account}/logs/{log}:
    get:
      description: get the backup logs for a specific backup run
      parameters:
        - *account-param
        - *log-param
      responses:
        <<: *not-found-response
        '200':
          description: backup logs for a specific backup run, streamed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/Log'
  /admin/accounts/{account}/instances/{instance}/traces:
    get:
      description: get list of backup traces for a specific instance, searchable based on parameters
      parameters:
        - *account-param
        - *instance-param
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
        - name: attribute
          in: query
          schema:
            type: string
          description: key=value filter (repeatable)
        - name: min_duration_ms
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: integer          
      responses:
        <<: *not-found-response
        '200':
          description: list of backup traces for a specific instance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/TraceSummary'
  /admin/accounts/{account}/traces:
    get:
      description: get list of backup traces for a specific account across all instances, searchable based on parameters
      parameters:
        - *account-param
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
        - name: attribute
          in: query
          schema:
            type: string
          description: key=value filter (repeatable)
        - name: min_duration_ms
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: integer          
      responses:
        <<: *not-found-response
        '200':
          description: list of backup traces for the account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/TraceSummary'

  /admin/accounts/{account}/traces/{trace}:
    get:
      description: get the backup traces for a specific backup run
      parameters:
        - *account-param
        - *trace-param
      responses:
        <<: *not-found-response
        '200':
          description: backup traces for a specific backup run, streamed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/Trace'
  /admin/accounts/{account}/traces/{trace}/spans/{span}:
    get:
      description: get a specific span within a specific trace
      parameters:
        - *account-param
        - *trace-param
        - *span-param
      responses:
        <<: *not-found-response
        '200':
          description: specific span
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/Span'
  /admin/accounts/{account}/instances/{instance}/configs:
    get:
      description: list all of the device configs for a specific instance
      parameters:
        - *account-param
        - *instance-param
      responses:
        <<: *not-found-response
        '200':
          description: list of device configs for the given instance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../external/databacker-api/src/schemas.yaml#/components/schemas/Config'
    post:
      description: create a new device config
      parameters:
        - *account-param
        - *instance-param
      requestBody:
        description: information for new device config
        content:
          application/json:
            schema:
              $ref: '../external/databacker-api/src/schemas.yaml#/components/schemas/Config'
      responses:
        '201':
          description: successfully created config
          content:
            application/json:
              schema:
                $ref: '../external/databacker-api/src/schemas.yaml#/components/schemas/Config'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/accounts/{account}/configs/{config}:
    get:
      description: retrieve a specific device config
      parameters:
        - *account-param
        - *config-param
      responses:
        <<: *not-found-response
        '200':
          description: details of the config
          content:
            application/json:
              schema:
                $ref: '../external/databacker-api/src/schemas.yaml#/components/schemas/Config'
    delete:
      description: delete a specific device config
      parameters:
        - *account-param
        - *config-param
      responses:
        '204':
          description: config successfully deleted
        <<: *not-found-response

  /admin/users:
    post:
      description: create a new user (admin only)
      requestBody:
        description: information for new user
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/UserBody'
      responses:
        '201':
          description: successfully created user
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/User'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/users/{user}:
    delete:
      description: delete a user (admin only)
      parameters:
        - *user-param
      responses:
        '204':
          description: user successfully deleted
        <<: *not-found-response

  /admin/accounts/{account}/users:
    get:
      description: list users in an account
      parameters:
        - *account-param
      responses:
        <<: *not-found-response
        '200':
          description: list of users in the account
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string # just list of user IDs
    post:
      description: add a user to an account
      parameters:
        - *account-param
      requestBody:
        description: user to add to account
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                  description: User ID to add to account
                role:
                  type: string
                  description: Role to assign to the user in the account
              required:
                - user
                - role
      responses:
        '201':
          description: user successfully added to account
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema
        <<: *not-found-response

  /admin/accounts/{account}/users/{user}:
    delete:
      description: remove a user from an account
      parameters:
        - *account-param
        - *user-param
      responses:
        '204':
          description: user successfully removed from account
        <<: *not-found-response
    patch:
      description: update a user's role in an account
      parameters:
        - *account-param
        - *user-param
      requestBody:
        description: role to assign to the user in the account
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  description: Role to assign to the user in the account
              required:
                - role
      responses:
        '200':
          description: user successfully updated in account
        <<: *not-found-response
