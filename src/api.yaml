openapi: 3.0.0
info:
  title: Databack Administration API
  description: API for administration of databacker instances
  version: "1.0.0"

servers:
  - url: /
    description: administration of databacker cloud

security:
  - JWT: []

# Common parameters and responses
x-parameters:
  account: &account-param
    in: path
    name: account
    schema:
      type: string
    required: true
    description: Account ID
  instance: &instance-param
    in: path
    name: instance
    schema:
      type: string
    required: true
    description: Unique ID of the databacker instance
  trace: &trace-param
    in: path
    name: trace
    schema:
      type: string
    required: true
    description: Unique ID of the trace
  span: &span-param
    in: path
    name: span
    schema:
      type: string
    required: true
    description: Unique ID of the span
  config: &config-param
    in: path
    name: config
    schema:
      type: string
    required: true
    description: Unique ID of the config
  log: &log-param
    in: path
    name: log
    schema:
      type: string
    required: true
    description: Unique ID of the log

x-responses:
  not-found: &not-found-response
    '404':
      description: not found
  error-message: &error-message-schema
    type: object
    properties:
      message:
        type: string
  invalid-request: &invalid-request-response
    '400':
      description: Invalid request
      content:
        application/json:
          schema:
            *error-message-schema
  quota-exceeded: &quota-exceeded-response
    '422':
      description: Quota exceeded
      content:
        application/json:
          schema:
            *error-message-schema

paths:      
  /admin/accounts:      
    get:
      description: list all of the accounts for which the authenticated user has access
      responses:
        '404':
          description: no accounts available
        '200':
          description: list of accounts for my user
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string # just list of IDs
    post:
      description: create a new account, normally limited to system administrators
      requestBody:
        description: information for new account
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/NewAccount'
      responses:
        '201':
          description: successfully created account
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/AccountBody'  # returns the body created
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object 
                properties:           
                  message:
                    type: string
        '422':
          description: Quota exceeded
          content:
            application/json:
              schema:
                type: object 
                properties:           
                  message:
                    type: string
  /admin/accounts/{account}:      
    get:
      description: get information about the specific account
      parameters:
        - *account-param
      responses:
        <<: *not-found-response
        '200':
          description: details of the account
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/AccountBody'
  /admin/accounts/{account}/instances:
    get:
      description: list all of the instances in a given account
      parameters:
        - *account-param
      responses:
        <<: *not-found-response
        '200':
          description: list of instances for the given account
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string # just list of IDs
    post:
      description: create a new licensed databacker instance in the given account
      parameters:
        - *account-param
      requestBody:
        description: information for new licensed databacker instance
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/NewInstance'
      responses:
        '201':
          description: successfully created instance
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/InstanceBody'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema
        '422':
          description: Quota exceeded
          content:
            application/json:
              schema:
                *error-message-schema
  /admin/accounts/{account}/instances/{instance}:
    get:
      description: get information about a specific instance
      parameters:
        - *account-param
        - *instance-param
      responses:
        <<: *not-found-response
        '200':
          description: details of the instance
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/InstanceBody'
    patch:
      description: update configuration of a specific instance
      parameters:
        - *account-param
        - *instance-param
      requestBody:
        description: instance configuration updates
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/NewInstance'
      responses:
        <<: *not-found-response
        '200':
          description: instance successfully updated
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/InstanceBody'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema
    delete:
      description: delete a specific instance
      parameters:
        - *account-param
        - *instance-param
      responses:
        '204':
          description: instance successfully deleted
        <<: *not-found-response

  /admin/accounts/{account}/instances/{instance}/logs:
    get:
      description: get list of backup logs for a specific instance
      parameters:
        - *account-param
        - *instance-param
      responses:
        <<: *not-found-response
        '200':
          description: list of backup logs for a specific instance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/LogSummary'

  /admin/accounts/{account}/logs/{log}:
    get:
      description: get the backup logs for a specific backup run
      parameters:
        - *account-param
        - *log-param
      responses:
        <<: *not-found-response
        '200':
          description: backup logs for a specific backup run, streamed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/Log'
  /admin/accounts/{account}/instances/{instance}/traces:
    get:
      description: get list of backup traces for a specific instance, searchable based on parameters
      parameters:
        - *account-param
        - *instance-param
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
        - name: attribute
          in: query
          schema:
            type: string
          description: key=value filter (repeatable)
        - name: min_duration_ms
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: integer          
      responses:
        <<: *not-found-response
        '200':
          description: list of backup traces for a specific instance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/TraceSummary'
  /admin/accounts/{account}/traces:
    get:
      description: get list of backup traces for a specific account across all instances, searchable based on parameters
      parameters:
        - *account-param
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
        - name: attribute
          in: query
          schema:
            type: string
          description: key=value filter (repeatable)
        - name: min_duration_ms
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: integer          
      responses:
        <<: *not-found-response
        '200':
          description: list of backup traces for the account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/TraceSummary'

  /admin/accounts/{account}/traces/{trace}:
    get:
      description: get the backup traces for a specific backup run
      parameters:
        - *account-param
        - *trace-param
      responses:
        <<: *not-found-response
        '200':
          description: backup traces for a specific backup run, streamed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/Trace'
  /admin/accounts/{account}/traces/{trace}/spans/{span}:
    get:
      description: get a specific span within a specific trace
      parameters:
        - *account-param
        - *trace-param
        - *span-param
      responses:
        <<: *not-found-response
        '200':
          description: specific span
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/Span'
  /admin/accounts/{account}/instances/{instance}/configs:
    get:
      description: list all of the device configs for a specific instance
      parameters:
        - *account-param
        - *instance-param
      responses:
        <<: *not-found-response
        '200':
          description: list of device configs for the given instance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../external/databacker-api/src/schemas.yaml#/components/schemas/Config'
    post:
      description: create a new device config
      parameters:
        - *account-param
        - *instance-param
      requestBody:
        description: information for new device config
        content:
          application/json:
            schema:
              $ref: '../external/databacker-api/src/schemas.yaml#/components/schemas/Config'
      responses:
        '201':
          description: successfully created config
          content:
            application/json:
              schema:
                $ref: '../external/databacker-api/src/schemas.yaml#/components/schemas/Config'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/accounts/{account}/configs/{config}:
    get:
      description: retrieve a specific device config
      parameters:
        - *account-param
        - *config-param
      responses:
        <<: *not-found-response
        '200':
          description: details of the config
          content:
            application/json:
              schema:
                $ref: '../external/databacker-api/src/schemas.yaml#/components/schemas/Config'
    delete:
      description: delete a specific device config
      parameters:
        - *account-param
        - *config-param
      responses:
        '204':
          description: config successfully deleted
        <<: *not-found-response
