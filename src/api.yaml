openapi: 3.0.0
info:
  title: Databack Administration API
  description: API for administration of databacker instances
  version: "1.0.0"

servers:
  - url: /
    description: administration of databacker cloud

security:
  - JWT: []

paths:            
  /admin/instances:
    get:
      description: list all of the instances for one or more accounts
      parameters:
        - in: query
          name: account
          schema:
            type: string
          # Using the default serialization for query parameters:
          # style=form, explode=false, allowReserved=false
          required: true
          description: Account IDs for which to retrieve list of instances
      responses:
        '404':
          description: no instances available
        '200':
          description: list of instances for my account
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string # just list of IDs
    post:
      description: create a new licensed databacker instance
      parameters:
        - in: query
          name: account
          schema:
            type: string
          # Using the default serialization for query parameters:
          # style=form, explode=false, allowReserved=false
          required: true
          description: Account ID for which to create a new instance
      requestBody:
        description: information for new licensed databacker instance
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/NewInstance'
      responses:
        '201':
          description: successfully created instance
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/InstanceBody'  # returns the body created
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object 
                properties:           
                  message:
                    type: string
        '422':
          description: Quota exceeded
          content:
            application/json:
              schema:
                type: object 
                properties:           
                  message:
                    type: string
  /admin/instances/{instance}:
    get:
      description: get information about a specific instance
      parameters:
        - in: path
          name: instance
          schema:
            type: string
          required: true
          description: Unique ID of the databacker instance whose information should be retrieved
      responses:
        '404':
          description: instance not found
        '200':
          description: details of the instance for my account
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/InstanceBody'

  /admin/instances/{instance}/logs:
    get:
      description: get list of backup logs for a specific instance
      parameters:
        - in: path
          name: instance
          schema:
            type: string
          required: true
          description: Unique ID of the databacker instance whose information should be retrieved
      responses:
        '404':
          description: instance not found
        '200':
          description: list of backup logs for a specific instance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/LogSummary'

  /admin/logs/{log}:
    get:
      description: get the backup logs for a specific backup run
      parameters:
        - in: path
          name: log
          schema:
            type: string
          required: true
          description: Unique ID of the backup whose information should be retrieved
      responses:
        '404':
          description: instance not found
        '200':
          description: backup logs for a specific backup run, streamed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/Log'
  /admin/instances/{instance}/traces:
    get:
      description: get list of backup traces for a specific instance, searchable based on parameters
      parameters:
        - in: path
          name: instance
          schema:
            type: string
          required: true
          description: Unique ID of the databacker instance whose information should be retrieved
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
        - name: attribute
          in: query
          schema:
            type: string
          description: key=value filter (repeatable)
        - name: min_duration_ms
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: integer          
      responses:
        '404':
          description: instance not found
        '200':
          description: list of backup traces for a specific instance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/TraceSummary'

  /admin/traces/{trace}:
    get:
      description: get the backup traces for a specific backup run
      parameters:
        - in: path
          name: trace
          schema:
            type: string
          required: true
          description: Unique ID of the trace to be retrieved
      responses:
        '404':
          description: instance not found
        '200':
          description: backup traces for a specific backup run, streamed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/Trace'
  /admin/traces/{trace}/spans/{span}:
    get:
      description: get a specific span within a specific trace
      parameters:
        - in: path
          name: trace
          schema:
            type: string
          required: true
          description: Unique ID of the trace to be retrieved
        - in: path
          name: span
          schema:
            type: string
          required: true
          description: Unique ID of the span to be retrieved
      responses:
        '404':
          description: trace not found, or span not found within the trace
        '200':
          description: specific span
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/Span'
  /admin/configs:
    post:
      description: create a new device config
      requestBody:
        description: information for new device config
        content:
          application/json:
            schema:
              $ref: 'https://raw.githubusercontent.com/databacker/api/refs/heads/main/src/schemas.yaml#/components/schemas/Config'
      responses:
        '201':
          description: successfully created config
          content:
            application/json:
              schema:
                $ref: 'https://raw.githubusercontent.com/databacker/api/refs/heads/main/src/schemas.yaml#/components/schemas/Config'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /admin/configs/{config}:
    get:
      description: get information about a specific device config
      parameters:
        - in: path
          name: config
          schema:
            type: string
          required: true
          description: Unique ID of the config to retrieve
      responses:
        '404':
          description: config not found
        '200':
          description: details of the config
          content:
            application/json:
              schema:
                $ref: 'https://raw.githubusercontent.com/databacker/api/refs/heads/main/src/schemas.yaml#/components/schemas/Config'
