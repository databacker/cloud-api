openapi: 3.0.0
info:
  title: Databack Administration API
  description: API for administration of databacker backup engines and protected databases
  version: "1.0.0"

servers:
  - url: /
    description: administration of databacker cloud

security:
  - JWT: []

# Common parameters and responses
x-parameters:
  limit: &limit-param
    in: query
    name: limit
    schema:
      type: integer
    required: false
    description: Maximum number of results to return
  offset: &offset-param
    in: query
    name: offset
    schema:
      type: integer
    required: false
    description: Number of results to skip
  account: &account-param
    in: path
    name: account
    schema:
      type: string
    required: true
    description: Account ID
  audit_event: &audit-event-param
    in: path
    name: event
    schema:
      type: string
      minLength: 1
    required: true
    description: Globally unique immutable audit event ID
  engine: &engine-param
    in: path
    name: engine
    schema:
      type: string
    required: true
    description: Unique ID of the backup engine
  registration_signature_input: &registration-signature-input-param
    in: header
    name: Signature-Input
    schema:
      type: string
      maxLength: 4096
    required: true
    description: |
      RFC 9421 signature parameters for immediate proof of possession of the
      submitted engine authentication key. See auth.md.
  registration_signature: &registration-signature-param
    in: header
    name: Signature
    schema:
      type: string
      maxLength: 1024
    required: true
    description: RFC 9421 Ed25519 registration proof. See auth.md.
  registration_content_digest: &registration-content-digest-param
    in: header
    name: Content-Digest
    schema:
      type: string
      maxLength: 128
    required: true
    description: RFC 9530 SHA-256 digest of the exact request body.
  registration_idempotency_key: &registration-idempotency-key-param
    in: header
    name: Idempotency-Key
    schema:
      type: string
      format: uuid
    required: true
    description: Stable UUID reused when retrying this registration request.
  optional_registration_signature_input: &optional-registration-signature-input-param
    in: header
    name: Signature-Input
    schema:
      type: string
      maxLength: 4096
    required: false
    description: Required when PATCH changes either submitted public key. See auth.md.
  optional_registration_signature: &optional-registration-signature-param
    in: header
    name: Signature
    schema:
      type: string
      maxLength: 1024
    required: false
    description: Required when PATCH changes either submitted public key. See auth.md.
  optional_registration_content_digest: &optional-registration-content-digest-param
    in: header
    name: Content-Digest
    schema:
      type: string
      maxLength: 128
    required: false
    description: Required when PATCH changes either submitted public key. See auth.md.
  optional_registration_idempotency_key: &optional-registration-idempotency-key-param
    in: header
    name: Idempotency-Key
    schema:
      type: string
      format: uuid
    required: false
    description: Required when PATCH changes either submitted public key. See auth.md.
  database: &database-param
    in: path
    name: database
    schema:
      type: string
    required: true
    description: Unique ID of the database target
  config: &config-param
    in: path
    name: config
    schema:
      type: string
    required: true
    description: Unique ID of the config
  log: &log-param
    in: path
    name: log
    schema:
      type: string
    required: true
    description: Unique ID of the log
  user: &user-param
    in: path
    name: user
    schema:
      type: string
    required: true
    description: Unique ID of the user
  backup: &backup-param
    in: path
    name: backup
    schema:
      type: string
    required: true
    description: Unique ID of the backup run
  billing_customer: &billing-customer-param
    in: path
    name: billing_customer
    schema:
      type: string
    required: true
    description: Unique ID of the billing customer/payer profile
  invoice: &invoice-param
    in: path
    name: invoice
    schema:
      type: string
    required: true
    description: Unique ID of the finalized invoice

x-responses:
  not-found: &not-found-response
    '404':
      description: not found
  error-message: &error-message-schema
    type: object
    properties:
      message:
        type: string
  invalid-request: &invalid-request-response
    '400':
      description: Invalid request
      content:
        application/json:
          schema:
            *error-message-schema
  quota-exceeded: &quota-exceeded-response
    '422':
      description: Quota exceeded
      content:
        application/json:
          schema:
            *error-message-schema

paths:      
  /auth/login:
    get:
      summary: Start browser OAuth login
      operationId: GetAuthLogin
      description: Starts browser OAuth login. Sets a transient OAuth state cookie and redirects to the configured identity provider authorization URL.
      security: []
      parameters:
        - name: redirect
          in: query
          required: false
          description: Post-login frontend redirect target.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the identity provider authorization URL.
          headers:
            Location:
              description: Configured identity provider authorization URL.
              schema:
                type: string
        '500':
          description: Authentication flow unavailable.

  /auth/callback:
    get:
      summary: Complete browser OAuth login
      operationId: GetAuthCallback
      description: Receives the OAuth authorization-code callback. Validates the transient OAuth state cookie and query parameter, exchanges the code for an identity provider token, fetches the user identity, sets the application session cookie, and redirects to the configured frontend destination.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code returned by the identity provider; omitted on some error callbacks.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: OAuth state returned by the identity provider; malformed or missing values are validated by the server.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Authorization error returned by the identity provider.
          schema:
            type: string
      responses:
        '302':
          description: Successful login redirect to the configured frontend destination.
          headers:
            Location:
              description: Configured post-login frontend destination.
              schema:
                type: string
        '400':
          description: Missing or invalid OAuth state or authorization code.
        '401':
          description: Authentication failed or the identity provider returned an authorization error.
        '500':
          description: Authentication flow unavailable.

  /auth/logout:
    get:
      summary: Terminate browser session
      operationId: GetAuthLogout
      description: Terminates the application browser session by validating an optional post-logout redirect target against the permitted frontend-origin allowlist, defaulting to the configured post-logout frontend destination when none is provided, and clearing the application session cookie and transient OAuth state cookie. If an identity provider logout endpoint is configured, the validated target is passed as its post_logout_redirect_uri; otherwise the response redirects directly to the validated target.
      security: []
      parameters:
        - name: redirect
          in: query
          required: false
          description: Post-logout frontend redirect target; must match a permitted frontend origin.
          schema:
            type: string
      responses:
        '302':
          description: Logout redirect.
          headers:
            Location:
              description: Configured identity provider logout endpoint or post-logout frontend destination.
              schema:
                type: string
        '400':
          description: Invalid post-logout redirect target.

  /admin/system/healthz:
    get:
      description: health check endpoint, accessible without authentication
      security: []
      responses:
        '200':
          description: system is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /admin/register:
    post:
      description: register a new user; does not require a pre-existing user record, only a valid JWT from the identity provider
      requestBody:
        description: information for the new user
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/UserWithEmail'
      responses:
        '201':
          description: successfully registered user
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ID'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/self:
    get:
      description: retrieve the profile of the calling user, scoped to the JWT subject
      responses:
        <<: *not-found-response
        '200':
          description: profile of the calling user
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/User'
    patch:
      description: update the profile of the calling user, scoped to the JWT subject
      requestBody:
        description: profile fields to update
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/UserBody'
      responses:
        <<: *not-found-response
        '200':
          description: profile successfully updated
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/User'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/self/email:
    patch:
      summary: Change user email address
      description: Request to change the email address. Triggers verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/Email'
      responses:
        '204':
          description: Email change requested, verification sent.
        '400':
          description: Invalid email or already in use.
        '401':
          description: Authentication required.

  /admin/self/email/verify:
    get:
      summary: Verify a pending email address
      operationId: GetAdminSelfEmailVerify
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email updated
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/User'
        '400':
          description: Invalid or expired token
        '401':
          description: Unauthorized

  /admin/self/bootstrap:
    post:
      operationId: BootstrapAdminSelf
      summary: Bootstrap initial onboarding resources
      description: Atomically create or return the calling verified user's initial onboarding resources. The operation is idempotent; repeated calls return the same completed bootstrap result without creating duplicate billing customers or accounts. If an earlier attempt partially completed, the implementation must safely reuse and finish the partial state. Requires an authenticated existing user with verified email. Ensures one initial dormant billing customer/payment profile, one default workspace/account owned by the user, and assignment of that workspace to the billing customer.
      responses:
        '200':
          description: Initial onboarding resources were created or already existed.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/SelfBootstrapResult'
        '401':
          description: Authentication required.
        '403':
          description: Email verification required.
          content:
            application/json:
              schema:
                *error-message-schema
        <<: *not-found-response

  /admin/self/accounts:
    get:
      description: list the accounts the calling user belongs to, along with their role in each
      parameters:
      - *offset-param
      - *limit-param
      responses:
        '200':
          description: list of accounts with roles
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/PaginatedSelfAccounts'
    post:
      description: create a new account; the calling user is automatically made the owner
      requestBody:
        description: information for the new account
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/AccountBody'
      responses:
        '201':
          description: successfully created account
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ID'
        '400':
          description: Invalid request or referenced billing customer not found
          content:
            application/json:
              schema:
                *error-message-schema
        '422':
          description: Quota exceeded
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/accounts/{account}:      
    get:
      description: get information about the specific account
      parameters:
        - *account-param
      responses:
        <<: *not-found-response
        '200':
          description: details of the account
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Account'
    patch:
      description: update general account details (admin only). Lifecycle metadata is read-only here; use the archive and restore actions to change archival state.
      parameters:
        - *account-param
      requestBody:
        description: account updates
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/Account'
      responses:
        <<: *not-found-response
        '200':
          description: account successfully updated
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Account'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema
    delete:
      description: delete an account (admin only)
      parameters:
        - *account-param
      responses:
        '204':
          description: account successfully deleted
        <<: *not-found-response

  /admin/accounts/{account}/archive:
    post:
      operationId: ArchiveAccount
      description: Archive the account and update its lifecycle metadata. This action requires the calling user to have the owner role for the account. It is idempotent, so archiving an already archived account succeeds. Archival is a lifecycle state and does not physically delete the account or its data.
      parameters:
        - *account-param
      responses:
        '200':
          description: account archived, or already archived, with updated lifecycle metadata
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Account'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                *error-message-schema
        '403':
          description: Account owner role required
          content:
            application/json:
              schema:
                *error-message-schema
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                *error-message-schema
        '409':
          description: Account cannot be archived because of a business-state conflict
          content:
            application/json:
              schema:
                *error-message-schema
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/accounts/{account}/restore:
    post:
      operationId: RestoreAccount
      description: Restore the account to active status and update its lifecycle metadata. This action requires the calling user to have the owner role for the account. It is idempotent, so restoring an already active account succeeds. Restoration changes lifecycle state and does not recreate physically deleted data.
      parameters:
        - *account-param
      responses:
        '200':
          description: account restored, or already active, with updated lifecycle metadata
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Account'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                *error-message-schema
        '403':
          description: Account owner role required
          content:
            application/json:
              schema:
                *error-message-schema
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                *error-message-schema
        '409':
          description: Account cannot be restored because of a business-state conflict
          content:
            application/json:
              schema:
                *error-message-schema
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/accounts/{account}/audit/events:
    get:
      operationId: ListAccountAuditEvents
      summary: List account change-audit history
      description: |
        Returns the authorized account view of Cloud's shared, immutable audit system of record;
        this is not a separate account audit store. Access is derived from current account
        authorization and initially requires the caller's current role to be owner. Stream
        inclusion is independently determined from the event's immutable, snapshotted
        `account_ids`, so customer, system-operator, automation, provider, and background-job
        changes affecting the account remain visible even if relationships later change.

        Results are ordered by `occurred_at` newest first, with a stable server-defined tie-breaker.
        Timestamps are RFC 3339 UTC values. Cursors are opaque and must be passed back unchanged.
        Events and their redacted values cannot be modified or deleted through this API.
      parameters:
        - *account-param
        - name: occurred_after
          in: query
          required: false
          description: Return events occurring strictly after this RFC 3339 UTC timestamp.
          schema:
            type: string
            format: date-time
        - name: occurred_before
          in: query
          required: false
          description: Return events occurring strictly before this RFC 3339 UTC timestamp.
          schema:
            type: string
            format: date-time
        - name: actor_id
          in: query
          required: false
          schema:
            type: string
        - name: actor_type
          in: query
          required: false
          schema:
            $ref: './schemas.yaml#/components/schemas/AuditActorType'
        - name: action
          in: query
          required: false
          description: Stable lower-case dotted action name.
          schema:
            type: string
        - name: domain
          in: query
          required: false
          schema:
            $ref: './schemas.yaml#/components/schemas/AuditDomain'
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
        - name: resource_id
          in: query
          required: false
          schema:
            type: string
        - name: outcome
          in: query
          required: false
          schema:
            $ref: './schemas.yaml#/components/schemas/AuditOutcome'
        - name: action_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum events to return; defaults to 50 and is bounded to 1 through 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque continuation cursor returned by the previous page.
          schema:
            type: string
      responses:
        '200':
          description: Authorized account audit events, newest first.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/PaginatedAccountAuditEvents'
              example:
                events:
                  - id: evt_operator_01
                    action_id: act_account_archive_01
                    occurred_at: '2026-08-05T10:00:00Z'
                    recorded_at: '2026-08-05T10:00:00Z'
                    actor:
                      type: user
                      id: operator_17
                      display: Databacker Support
                      system_roles: [cloud_admin]
                      authentication_type: bearer
                    action: cloud.account.archived
                    domain: cloud
                    resource_type: account
                    resource_id: account_123
                    account_ids: [account_123]
                    outcome: succeeded
                    risk_level: 2
                    changes:
                      - field: archived
                        before: false
                        after: true
                        classification: ordinary
                    source: operator_tool
                    schema_version: '1'
                next_cursor: null
                has_more: false
        '400':
          description: Invalid filter, time range, limit, or cursor.
          content:
            application/json:
              schema:
                *error-message-schema
        '401':
          description: Authentication required.
        '403':
          description: Current account owner role required; no separate audit-view permission exists yet.
        '404':
          description: Account not found.

  /admin/accounts/{account}/audit/events/{event}:
    get:
      operationId: GetAccountAuditEvent
      summary: Get one account change-audit event
      description: |
        Returns one immutable, redacted event from Cloud's shared audit system of record. Current
        account authorization (initially the owner role) controls access, while the event is in
        the account view only when its immutable `account_ids` snapshot contains the requested
        account. A missing event, an event outside that snapshot, and an event belonging only to
        an unrelated account all return the same 404 response and reveal no event information.
      parameters:
        - *account-param
        - *audit-event-param
      responses:
        '200':
          description: Authorized account audit event.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/AccountAuditEvent'
        '401':
          description: Authentication required.
        '403':
          description: Current account owner role required; no separate audit-view permission exists yet.
        '404':
          description: Event not found in the requested authorized account view; also used for an unrelated account to prevent disclosure.

  /admin/billing/catalog:
    get:
      operationId: GetBillingCatalog
      description: get the tenant-facing billing catalog.
      responses:
        '200':
          description: billing catalog
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/BillingCatalog'

  /admin/billing/customers:
    get:
      operationId: ListBillingCustomers
      description: list billing customers/payment profiles accessible to the authenticated user for payer selection. Signup/default-workspace creation automatically associates the workspace with a dormant billing customer, so users do not need to create one before exploring the product.
      parameters:
        - *offset-param
        - *limit-param
      responses:
        '200':
          description: accessible billing customers
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/PaginatedBillingCustomers'
    post:
      operationId: CreateBillingCustomer
      description: create an additional billing customer/payment profile. Only authorized tenant/workspace billing administrators may create additional payer profiles. This creates non-sensitive Databacker-owned profile metadata only; payment readiness is established through provider/MoR confirmation after a hosted portal flow or server-side lookup.
      requestBody:
        description: billing customer profile details
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/BillingCustomerBody'
      responses:
        '201':
          description: billing customer created
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/BillingCustomer'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/billing/customers/{billing_customer}:
    get:
      operationId: GetBillingCustomer
      description: get billing customer/payment profile details, including non-sensitive profile metadata, billing readiness, provider payment-method display status, and visible workspace associations.
      parameters:
        - *billing-customer-param
      responses:
        <<: *not-found-response
        '200':
          description: billing customer details
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/BillingCustomer'

  /admin/billing/customers/{billing_customer}/profile:
    put:
      operationId: PutBillingCustomerProfile
      description: update non-sensitive Databacker-owned billing customer profile information. This endpoint never accepts raw card, bank, or other payment credentials and does not create payment readiness.
      parameters:
        - *billing-customer-param
      requestBody:
        description: replacement billing customer profile
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/BillingCustomerProfile'
      responses:
        <<: *not-found-response
        '200':
          description: billing customer profile updated
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/BillingCustomer'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/billing/customers/{billing_customer}/portal-session:
    post:
      operationId: CreateBillingPortalSession
      description: create a single commerce-provider-hosted session for initial setup, payment-method management, provider commercial profile management, invoice self-service, or a general billing portal. Databacker does not accept raw payment credentials. A browser redirect result must not mark the customer billing-ready; payment-based readiness and invoice synchronization are established only by verified provider confirmation through webhook/callback processing or a server-side provider lookup.
      parameters:
        - *billing-customer-param
      requestBody:
        description: hosted portal session request
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/PortalSessionRequest'
      responses:
        <<: *not-found-response
        '201':
          description: hosted portal session created
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/PortalSession'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                *error-message-schema

  /admin/billing/customers/{billing_customer}/summary:
    get:
      operationId: GetBillingCustomerSummary
      description: get billing summary aggregated for the payer across visible workspaces/resources.
      parameters:
        - *billing-customer-param
      responses:
        <<: *not-found-response
        '200':
          description: billing customer summary
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/BillingSummary'

  /admin/billing/customers/{billing_customer}/estimate:
    get:
      operationId: GetBillingCustomerEstimate
      description: estimate billing charges for the payer using entitlement intervals.
      parameters:
        - *billing-customer-param
        - name: period_start
          in: query
          schema:
            type: string
            format: date-time
          required: false
        - name: period_end
          in: query
          schema:
            type: string
            format: date-time
          required: false
      responses:
        <<: *not-found-response
        '200':
          description: billing customer estimate
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/BillingEstimate'

  /admin/billing/customers/{billing_customer}/entitlements:
    get:
      operationId: ListBillingCustomerEntitlements
      description: list auditable entitlement intervals attributed to the payer.
      parameters:
        - *billing-customer-param
        - *offset-param
        - *limit-param
      responses:
