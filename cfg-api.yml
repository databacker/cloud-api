package: api
generate:
  chi-server: true
  models: true
  strict-server: true
output: go/api/api.go
output-options:
  skip-prune: true
  name-normalizer: ToCamelCaseWithInitialisms
  yaml-tags: true
import-mapping:
  ./schemas.yaml: "-"
  "../external/databacker-api/src/schemas.yaml": "github.com/databacker/api/go/api"
  "../external/databacker-api/src/api.yaml": "github.com/databacker/api/go/api"